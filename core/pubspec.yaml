name: core
version: 0.0.1
publish_to: none
description: Project core module

environment:
  sdk: '>=3.8.0 <4.0.0'
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  data:
    path: ../data
  domain:
    path: ../domain
  navigation:
    path: ../navigation

  get_it: ^8.2.0
  dio: ^5.9.0
  logger: ^2.6.1
  flutter_bloc: ^9.1.1
  easy_localization: ^3.0.8
  equatable: ^2.0.7
  freezed: ^3.2.3
  freezed_annotation: ^3.1.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: ^2.7.0
  json_serializable: ^6.11.1
  flutter_gen: ^5.11.0

# Assets live in this package, so they are bundled under `packages/core/...`.
# package_parameter_enabled keeps the generated paths package-aware so they
# resolve when referenced from other modules (core_ui, features).
flutter_gen:
  output: ../core_ui/lib/assets_gen/
  line_length: 80

  integrations:
    image: false
    flutter_svg: false
    rive: true
    lottie: true

  assets:
    enabled: true
    outputs:
      package_parameter_enabled: true
      style: camel-case
      class_name: AppAssets

  fonts:
    enabled: false

flutter:
  uses-material-design: true
  assets:
    - resources/
    - resources/translations/
    - resources/icons/outline/
    - resources/icons/filled/
